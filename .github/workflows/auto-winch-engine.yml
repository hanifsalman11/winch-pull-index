name: Autonomous 4x4 Winch Pull & Recovery Sizing Engine

on:
  schedule:
    - cron: '24 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_winch:
        description: 'Optional Vehicle or Winch Model (e.g. Warn VR EVO 12-S or Jeep Gladiator)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-winch-calculators:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Winch Calculators & Ping Search Engines
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          PAGES_PER_RUN: '3'
          CUSTOM_WINCH: ${{ github.event.inputs.custom_winch || '' }}
        run: |
          python engine/winch_builder.py

      - name: Commit & Push to Trigger GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/published_winches.json
          if git diff --staged --quiet; then
            echo "No new winch calculator pages to commit."
          else
            git commit -m "chore(winch): auto-publish new 4x4 winch pull & drum layer calculators"
            git push origin main
          fi
